name: Update VPN subscription

on:
  schedule:
    - cron: "0 * * * *"   # каждый час, в 00 минут
  workflow_dispatch: {}    # ручной запуск кнопкой в Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build subscription.json
        run: python build_subscription.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add subscription.json
          git diff --staged --quiet || git commit -m "chore: auto-update subscription"
          git push
